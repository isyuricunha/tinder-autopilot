name: Extension CI and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm package:extension

  release:
    if: github.event_name == 'push' && github.repository == 'isyuricunha/tinder-autopilot'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extension-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize legacy release baseline
        run: |
          baseline=3c48cdc6e5344dd3bc3b24ebab977469e7682d47
          ref=refs/tags/v3.0.0

          # Preserve the version of builds distributed before semantic-release.
          if ! git merge-base --is-ancestor "$baseline" HEAD; then
            echo "::error::The 3.0.0 baseline commit is missing from the release branch history."
            exit 1
          fi
          if git show-ref --verify --quiet "$ref"; then
            if [ "$(git rev-parse "$ref^{commit}")" != "$baseline" ]; then
              echo "::error::v3.0.0 points to a different commit than the 3.0.0 baseline."
              exit 1
            fi
          else
            # semantic-release pushes this local baseline alongside the new release tag.
            git tag "${ref#refs/tags/}" "$baseline"
          fi
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
